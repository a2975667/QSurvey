name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # Only run on push if commit message contains "[deploy]"
    paths-ignore:
      - '**'

jobs:
  check-commit:
    if: contains(github.event.head_commit.message, 'deploy') || contains(github.event.head_commit.message, 'Deploy') || contains(github.event.head_commit.message, 'DEPLOY')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy marker found; proceeding with deploy job."

  deploy:
    needs: [check-commit]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'deploy') || contains(github.event.head_commit.message, 'Deploy') || contains(github.event.head_commit.message, 'DEPLOY')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and submit with Cloud Build
        run: |
          gcloud config set project ${{ vars.GCP_PROJECT }}
          gcloud builds submit --config cloudbuild.yaml \
            --substitutions=_TAG=${{ github.sha }},_REGION=${{ vars.GCP_REGION }},_SERVICE=qsurvey-online
