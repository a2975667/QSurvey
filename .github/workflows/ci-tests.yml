name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - name: Install client dependencies
        run: npm ci
        working-directory: client
      - name: Run client tests (CI)
        run: CI=true npm test -- --runInBand
        working-directory: client

  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Run server tests (CI)
        run: CI=true npm test -- --runInBand
        working-directory: server
      - name: Check compressed request parsing
        run: npm run test:security
        working-directory: server
      - name: Build server
        run: npm run build
        working-directory: server
      - name: Audit server production dependencies
        run: npm audit --omit=dev
        working-directory: server
